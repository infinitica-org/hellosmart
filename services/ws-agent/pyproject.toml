[project]
name = "hs-ws-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "watchdog==5.0.3",
  "httpx==0.27.2",
  "structlog==24.4.0",
]

[dependency-groups]
dev = ["pytest==8.3.3", "ruff==0.7.3", "mypy==1.13.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
platform = "linux"  # production target is always Linux; see pty_session.py's module docstring

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ws_agent"]
