[project]
name = "hs-ai-proxy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "httpx==0.28.1",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "pyjwt[crypto]==2.15.1",
  "redis==5.3.1",
  "boto3==1.43.122",
  "structlog==24.4.0",
]

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==0.26.0", "ruff==0.17.3", "mypy==1.20.2", "respx==0.23.1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "ASYNC", "RUF"]

[tool.mypy]
strict = true
