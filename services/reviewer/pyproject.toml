[project]
name = "hs-reviewer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.4",
  "uvicorn[standard]==0.32.0",
  "anthropic==0.39.0",
  "pydantic==2.9.2",
  "pydantic-settings==2.6.1",
  "pyyaml==6.0.2",
  "boto3==1.35.54",
  "structlog==24.4.0",
]

[dependency-groups]
dev = ["pytest==8.3.3", "ruff==0.17.1", "mypy==1.13.0", "types-pyyaml==6.0.12.20240917"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "RUF"]

[tool.mypy]
strict = true
