[project]
name = "hs-reviewer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.159.1",
  "uvicorn[standard]==0.54.0",
  "anthropic==0.125.0",
  "httpx==0.28.1",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "pyyaml==6.0.3",
  "boto3==1.43.117",
  "structlog==24.4.0",
]

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==0.26.0", "ruff==0.17.1", "mypy==1.20.2", "respx==0.23.1", "types-pyyaml==6.0.12.20240917"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is the normal pytest idiom; S105/S106 flag deliberately fake,
# key-shaped test fixtures, not real secrets.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
