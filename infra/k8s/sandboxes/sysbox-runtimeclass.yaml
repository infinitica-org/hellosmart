apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: sysbox
  labels:
    app.kubernetes.io/part-of: hellosmart-fabric
    hellosmart.ai/sandbox-type: interactive-workspace
handler: sysbox-runc
overhead:
  podFixed:
    memory: "64Mi"
    cpu: "50m"
scheduling:
  nodeSelector:
    hellosmart.ai/runtime: sysbox
  tolerations:
    - key: "hellosmart.ai/workspace-workload"
      operator: "Exists"
      effect: "NoSchedule"
