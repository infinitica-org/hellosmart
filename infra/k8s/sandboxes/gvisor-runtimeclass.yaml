apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
  labels:
    app.kubernetes.io/part-of: hellosmart-fabric
    hellosmart.ai/sandbox-type: evaluator-grader
handler: runsc
overhead:
  podFixed:
    memory: "50Mi"
    cpu: "100m"
scheduling:
  nodeSelector:
    hellosmart.ai/runtime: gvisor
  tolerations:
    - key: "hellosmart.ai/untrusted-workload"
      operator: "Exists"
      effect: "NoSchedule"
