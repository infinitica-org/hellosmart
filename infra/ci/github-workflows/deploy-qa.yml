# dev branch → QA VPS (KVM). Runs on every merge to dev.
# Install: copy to .github/workflows/ (agents cannot edit that folder by design).
name: deploy-qa
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: deploy-qa
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [web, api, worker, ai-proxy, reviewer, ws-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build + push
        run: |
          IMG="ghcr.io/${{ github.repository_owner }}/hs-${{ matrix.image }}:${{ github.sha }}"
          docker build -f infra/docker/${{ matrix.image }}.Dockerfile -t "$IMG" .
          docker push "$IMG"
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/hs-${{ matrix.image }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: qa
    steps:
      - uses: actions/checkout@v4
      - name: ssh setup
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.QA_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.QA_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: sync compose files
        run: |
          scp -P "${{ vars.QA_SSH_PORT || '2222' }}" infra/qa-vps/docker-compose.qa.yml infra/qa-vps/Caddyfile infra/qa-vps/qa.sh \
            "${{ secrets.QA_SSH_USER }}@${{ secrets.QA_SSH_HOST }}:/srv/hellosmart/"
      - name: deploy
        run: |
          ssh -p "${{ vars.QA_SSH_PORT || '2222' }}" "${{ secrets.QA_SSH_USER }}@${{ secrets.QA_SSH_HOST }}" \
            "cd /srv/hellosmart && chmod +x qa.sh && ./qa.sh deploy ${{ github.sha }}"
