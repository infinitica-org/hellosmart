# Security gates. High/critical findings fail the build. Install: copy to .github/workflows/.
name: security
on:
  pull_request:
  push:
    branches: [main, dev]
  schedule:
    - cron: "30 20 * * *" # nightly 02:00 IST
permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITLEAKS_CONFIG: .gitleaks.toml }

  codeql:
    runs-on: ubuntu-24.04
    permissions: { security-events: write, contents: read }
    strategy:
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: "${{ matrix.language }}", queries: security-extended }
      - uses: github/codeql-action/analyze@v3

  semgrep:
    runs-on: ubuntu-24.04
    container: { image: semgrep/semgrep:1.95.0 }
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --error --config p/owasp-top-ten --config p/typescript --config p/python --config p/secrets --config .semgrep/

  dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions: { contents: read, pull-requests: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0, SSPL-1.0

  trivy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  iac:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/
          framework: terraform,dockerfile,github_actions
          soft_fail: false
