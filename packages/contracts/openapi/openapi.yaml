openapi: 3.1.0
info:
  title: HelloSmart API
  version: 0.1.0
  license:
    name: Proprietary
  description: |
    Contract-first API (frozen 30 Oct 2026; additive changes only after that).
    Org is always derived from the session, never from the request (BR-01).
    Cross-org access returns 404, never 403, to avoid existence leaks.
    Full path list: AGENTS.md §13. Each department adds its paths here via a `contract:` PR in S0.
servers:
  - url: http://localhost:4010/api/v1
    description: Prism mock server
  - url: http://localhost:4000/api/v1
    description: Local development API
security:
  - session: []
tags:
  - name: auth
    description: Master authentication, session management, and SSO verification
  - name: admin
    description: Platform Admin tenant provisioning and organization operations
  - name: org
    description: Tenant configuration and branding
  - name: candidates
    description: Candidate management and onboarding
  - name: candidate-portal
    description: Candidate assessment session and workspace launch
  - name: assessments
    description: Assessment blueprints, rubrics, and timing configurations
  - name: webhooks
    description: External integration webhooks
paths:
  /auth/login:
    post:
      summary: Authenticate user with email and password
      tags: [auth]
      operationId: authLogin
      x-requirement: [CO-001, CA-002]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 1, maxLength: 256 }
                mfaCode: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Logged in successfully; session cookie set (HttpOnly, Secure, SameSite=Lax).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              examples:
                platformAdmin:
                  summary: Platform Admin user profile
                  value:
                    id: '11111111-1111-4111-8111-111111111111'
                    email: 'superadmin@hellosmart.ai'
                    name: 'Super Admin'
                    role: 'platform_admin'
                    portal: 'admin'
                    mustResetPassword: false
                    org: null
                companyAdmin:
                  summary: Company Admin user profile
                  value:
                    id: '22222222-2222-4222-8222-222222222222'
                    email: 'admin@asterridge.com'
                    name: 'Aster Ridge Admin'
                    role: 'company_admin'
                    portal: 'company'
                    mustResetPassword: false
                    org:
                      id: 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'
                      name: 'Aster Ridge Inc.'
                      logoUrl: 'https://cdn.hellosmart.ai/aster.png'
                candidate:
                  summary: Candidate user profile
                  value:
                    id: '33333333-3333-4333-8333-333333333333'
                    email: 'candidate@example.com'
                    name: 'Sarah Connor'
                    role: 'candidate'
                    portal: 'candidate'
                    mustResetPassword: false
                    org:
                      id: 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'
                      name: 'Aster Ridge Inc.'
                      logoUrl: null
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'

  /auth/sso/verify:
    post:
      tags: [auth]
      summary: Verify third-party SSO token (Google or Microsoft)
      operationId: authSsoVerify
      x-requirement: [CO-001, BR-04]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, idToken]
              properties:
                provider: { type: string, enum: [google, microsoft] }
                idToken: { type: string, minLength: 1 }
      responses:
        '200':
          description: SSO token verified; session cookie set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /auth/mfa/verify:
    post:
      tags: [auth]
      summary: Verify TOTP multi-factor authentication code
      operationId: authMfaVerify
      x-requirement: [AD-001]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preAuthToken, totpCode]
              properties:
                preAuthToken: { type: string, minLength: 1 }
                totpCode: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: MFA verification successful; full session cookie issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401':
          $ref: '#/components/responses/Problem'

  /auth/logout:
    post:
      tags: [auth]
      summary: Invalidate user session and clear authentication cookies
      operationId: authLogout
      x-requirement: [CO-001]
      responses:
        '200':
          description: Logged out successfully.
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 'Logged out successfully' }

  /auth/logout-all:
    post:
      tags: [auth]
      summary: Revoke all active sessions for the authenticated user
      operationId: authLogoutAll
      x-requirement: [S0-T16-1]
      responses:
        '200':
          description: All sessions revoked and cookie cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutAllResponse'
        '401': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /auth/sessions:
    get:
      tags: [auth]
      summary: List all active sessions for the authenticated user
      operationId: listSessions
      x-requirement: [S0-T16-1]
      responses:
        '200':
          description: Active sessions list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '401': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /auth/sessions/{id}:
    delete:
      tags: [auth]
      summary: Revoke a specific active session owned by the authenticated user
      operationId: revokeSession
      x-requirement: [S0-T16-1]
      parameters:
        - name: id
          in: path
          required: true
          description: The public session ID to revoke
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session revoked successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeSessionResponse'
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }


  /auth/invitations/{token}:
    get:
      summary: Validate an invitation token and fetch details
      tags: [auth]
      operationId: validateInvitation
      x-requirement: [S0-T08-1, BR-24]
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: Raw 32-byte invitation token
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Valid, unexpired, unused invitation details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationDetails' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /auth/invitations/accept:
    post:
      summary: Accept an invitation and set user password
      tags: [auth]
      operationId: acceptInvitation
      x-requirement: [S0-T08-1, BR-24]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '200':
          description: Invitation accepted, user activated, password set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcceptInvitationResponse' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /auth/password/change:
    post:
      tags: [auth]
      summary: Change authenticated user password and revoke other sessions
      operationId: authChangePassword
      x-requirement: [CO-001, CA-002, S0-T17-1]
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              additionalProperties: false
              properties:
                currentPassword: { type: string, minLength: 1, maxLength: 128 }
                newPassword: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Password changed successfully; other sessions revoked.
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 'Password changed successfully.' }
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

  /me:
    get:
      tags: [auth]
      summary: Get current authenticated user profile and portal route
      operationId: getMe
      x-requirement: [CO-004]
      responses:
        '200':
          description: Current user and portal to route to.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              examples:
                platformAdmin:
                  value:
                    id: '11111111-1111-4111-8111-111111111111'
                    email: 'superadmin@hellosmart.ai'
                    name: 'Super Admin'
                    role: 'platform_admin'
                    portal: 'admin'
                    mustResetPassword: false
                    org: null
                companyAdmin:
                  value:
                    id: '22222222-2222-4222-8222-222222222222'
                    email: 'admin@asterridge.com'
                    name: 'Aster Ridge Admin'
                    role: 'company_admin'
                    portal: 'company'
                    mustResetPassword: false
                    org:
                      id: 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'
                      name: 'Aster Ridge Inc.'
                      logoUrl: 'https://cdn.hellosmart.ai/aster.png'
                candidate:
                  value:
                    id: '33333333-3333-4333-8333-333333333333'
                    email: 'candidate@example.com'
                    name: 'Sarah Connor'
                    role: 'candidate'
                    portal: 'candidate'
                    mustResetPassword: false
                    org:
                      id: 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'
                      name: 'Aster Ridge Inc.'
                      logoUrl: null
        '401':
          $ref: '#/components/responses/Problem'

  /admin/organizations:
    get:
      tags: [admin]
      summary: List organizations with pagination, status filtering, and search (Platform Admin only)
      operationId: listOrganizations
      x-requirement: [AD-001, S0-T11-1]
      x-roles: [platform_admin]
      parameters:
        - name: page
          in: query
          description: Page number (1-based)
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: pageSize
          in: query
          description: Page size (maximum 100)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 20
        - name: status
          in: query
          description: Filter organizations by status
          required: false
          schema:
            $ref: '#/components/schemas/OrgStatus'
          example: 'trial_active'
        - name: search
          in: query
          description: Search by organization name or slug
          required: false
          schema:
            type: string
            maxLength: 100
          example: 'Brindle'
      responses:
        '200':
          description: Paginated list of organizations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedOrgList' }
              examples:
                defaultList:
                  summary: Default list of organizations
                  value:
                    items:
                      - id: 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'
                        name: 'Aster Ridge Inc.'
                        slug: 'aster-ridge'
                        status: 'paid_active'
                        candidateCount: 18
                        createdAt: '2026-09-15T08:00:00.000Z'
                        trialEndsAt: null
                      - id: '00000000-0000-4000-8000-000000000001'
                        name: 'Brindle & Co'
                        slug: 'brindle-co'
                        status: 'trial_active'
                        candidateCount: 24
                        createdAt: '2026-10-01T10:00:00.000Z'
                        trialEndsAt: '2026-11-01T10:00:00.000Z'
                      - id: 'cccccccc-cccc-4ccc-8ccc-cccccccccccc'
                        name: 'Apex Labs'
                        slug: 'apex-labs'
                        status: 'suspended'
                        candidateCount: 0
                        createdAt: '2026-08-01T12:00:00.000Z'
                        trialEndsAt: null
                    page: 1
                    pageSize: 20
                    total: 3
                filteredTrial:
                  summary: Filtered by trial_active search for Brindle
                  value:
                    items:
                      - id: '00000000-0000-4000-8000-000000000001'
                        name: 'Brindle & Co'
                        slug: 'brindle-co'
                        status: 'trial_active'
                        candidateCount: 24
                        createdAt: '2026-10-01T10:00:00.000Z'
                        trialEndsAt: '2026-11-01T10:00:00.000Z'
                    page: 1
                    pageSize: 20
                    total: 1
                emptyList:
                  summary: Empty page result
                  value:
                    items: []
                    page: 2
                    pageSize: 20
                    total: 3
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    post:
      tags: [admin]
      summary: Provision a new customer tenant organization (Platform Admin only)
      operationId: provisionOrganization
      x-requirement: [AD-001, BR-04]
      x-roles: [platform_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, adminEmail, adminName]
              properties:
                name: { type: string, minLength: 1, maxLength: 120, example: 'Brindle & Co' }
                slug: { type: string, pattern: '^[a-z0-9-]+$', example: 'brindle-co' }
                planId: { type: string, example: 'plan_trial' }
                retentionDays: { type: integer, minimum: 1, maximum: 365, default: 90 }
                whiteLabel: { type: boolean, default: false }
                customDomain: { type: string, example: 'assess.brindle.co' }
                adminEmail: { type: string, format: email, example: 'admin@brindle.co' }
                adminName: { type: string, minLength: 1, example: 'Jane Doe' }
      responses:
        '201':
          description: Organization created and initial admin user invited.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /admin/organizations/{id}/status:
    patch:
      tags: [admin]
      summary: Update organization status (activate or suspend)
      operationId: updateOrganizationStatus
      x-requirement: [AD-001]
      x-roles: [platform_admin]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [provisioned, trial_active, paid_active, suspended]
                  example: 'suspended'
                reason:
                  type: string
                  example: 'Payment overdue'
      responses:
        '200':
          description: Organization status updated successfully.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /admin/metrics:
    get:
      tags: [admin]
      summary: Get platform admin overview dashboard metrics (Platform Admin only)
      operationId: getAdminMetrics
      x-requirement: [AD-001, S0-T11-1]
      x-roles: [platform_admin]
      responses:
        '200':
          description: Summary platform metrics for total companies, active trials, and total candidates.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminMetrics' }
              examples:
                defaultMetrics:
                  summary: Platform overview metrics
                  value:
                    totalCompanies: 3
                    activeTrials: 1
                    totalCandidates: 42
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /candidates:
    get:
      summary: List candidates in the caller's organization
      tags: [candidates]
      operationId: listCandidates
      x-requirement: [CO-014]
      x-roles: [company_admin]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/CandidateStatus' } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Page of candidates in the caller's org.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Candidate' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      summary: Create and invite a candidate to an assessment
      tags: [candidates]
      operationId: createCandidate
      x-requirement: [CO-011, CO-013]
      x-roles: [company_admin]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '201':
          description: Created; invite email queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Candidate' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /candidate/assignments/{id}/connect:
    post:
      summary: Connect to candidate workspace session
      tags: [candidate-portal]
      operationId: connectWorkspace
      x-requirement: [CA-008, CA-012, BR-06, BR-08, BR-12]
      x-roles: [candidate]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Workspace ready; connection details are single-use and short-lived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceConnection' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: hs_session }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Cursor: { name: cursor, in: query, schema: { type: string, maxLength: 200 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
  responses:
    Problem:
      description: RFC 9457 problem details. Never includes stack traces, SQL or secrets.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            unauthorized:
              summary: 401 Unauthorized example
              value:
                type: 'https://hellosmart.ai/problems/unauthorized'
                title: 'Unauthorized'
                status: 401
                detail: 'Invalid credentials or session expired'
                code: 'INVALID_CREDENTIALS'
                requestId: 'req_unauth_001'
            forbidden:
              summary: 403 Forbidden example
              value:
                type: 'https://hellosmart.ai/problems/forbidden'
                title: 'Forbidden'
                status: 403
                detail: 'Insufficient permissions for this action'
                code: 'FORBIDDEN'
                requestId: 'req_forbid_002'
            rateLimited:
              summary: 429 Rate Limited example
              value:
                type: 'https://hellosmart.ai/problems/rate-limited'
                title: 'Too Many Requests'
                status: 429
                detail: 'Rate limit exceeded. Please wait 60 seconds before retrying.'
                code: 'RATE_LIMITED'
                requestId: 'req_rate_003'
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string, description: 'Stable machine code, e.g. TRIAL_CAP_REACHED, WINDOW_NOT_OPEN, CONSENT_REQUIRED' }
        requestId: { type: string }
    Role: { type: string, enum: [platform_admin, company_admin, candidate] }
    InvitationDetails:
      type: object
      required: [email, role, orgName]
      properties:
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        orgName: { type: string }
    AcceptInvitationRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 1 }
        password: { type: string, minLength: 12, maxLength: 128 }
    AcceptInvitationResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, enum: [true] }
        message: { type: string }
    Me:
      type: object
      required: [id, email, name, role, portal]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        portal: { type: string, enum: [admin, company, candidate] }
        mustResetPassword: { type: boolean }
        org:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            logoUrl: { type: [string, 'null'] }
    Organization:
      type: object
      required: [id, name, slug, status, whiteLabel, retentionDays, createdAt]
      properties:
        id: { type: string, format: uuid, example: 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa' }
        name: { type: string, example: 'Aster Ridge Inc.' }
        slug: { type: string, example: 'aster-ridge' }
        status: { $ref: '#/components/schemas/OrgStatus', example: 'paid_active' }
        planId: { type: [string, 'null'], example: 'plan_growth' }
        logoUrl: { type: [string, 'null'], example: 'https://cdn.hellosmart.ai/aster.png' }
        whiteLabel: { type: boolean, example: false }
        customDomain: { type: [string, 'null'], example: 'assess.asterridge.com' }
        retentionDays: { type: integer, example: 90 }
        createdAt: { type: string, format: date-time, example: '2026-10-01T00:00:00Z' }
    OrgStatus:
      type: string
      enum: [provisioned, trial, trial_active, trial_expired, active, paid_active, suspended]
    OrgListItem:
      type: object
      required: [id, name, slug, status, candidateCount, createdAt]
      properties:
        id: { type: string, format: uuid, example: '00000000-0000-4000-8000-000000000001' }
        name: { type: string, minLength: 1, maxLength: 120, example: 'Brindle & Co' }
        slug: { type: string, minLength: 1, maxLength: 64, example: 'brindle-co' }
        status: { $ref: '#/components/schemas/OrgStatus' }
        candidateCount: { type: integer, minimum: 0, example: 24 }
        createdAt: { type: string, format: date-time, example: '2026-10-01T10:00:00.000Z' }
        trialEndsAt: { type: [string, 'null'], format: date-time, example: '2026-11-01T10:00:00.000Z' }
    PaginatedOrgList:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrgListItem'
        page: { type: integer, minimum: 1, example: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100, example: 20 }
        total: { type: integer, minimum: 0, example: 3 }
    AdminMetrics:
      type: object
      required: [totalCompanies, activeTrials, totalCandidates]
      properties:
        totalCompanies: { type: integer, minimum: 0, example: 3 }
        activeTrials: { type: integer, minimum: 0, example: 1 }
        totalCandidates: { type: integer, minimum: 0, example: 42 }
    CandidateStatus: { type: string, enum: [invited, active, deleted] }
    Candidate:
      type: object
      required: [id, name, email, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        status: { $ref: '#/components/schemas/CandidateStatus' }
        countedAgainstCapAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    WorkspaceConnection:
      type: object
      required: [workspaceId, mode, gatewayUrl, ticket, deadlineAt]
      properties:
        workspaceId: { type: string, format: uuid }
        mode: { type: string, enum: [cloud, chat] }
        gatewayUrl: { type: string, format: uri }
        ticket: { type: string, description: 'Single-use, 60 s TTL, bound to workspace + user' }
        deadlineAt: { type: string, format: date-time }
        requireFullscreen: { type: boolean }

    SessionPublic:
      type: object
      required: [sessionId, device, ip, createdAt, lastSeenAt, current]
      properties:
        sessionId: { type: string, format: uuid }
        device: { type: string, example: 'Chrome on Windows' }
        ip: { type: string, example: '127.0.0.xxx' }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        current: { type: boolean }
    SessionListResponse:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionPublic'
    RevokeSessionResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: 'Session revoked successfully' }
    LogoutAllResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: 'All sessions revoked successfully' }

