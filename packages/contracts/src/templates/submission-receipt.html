<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submission received</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f8;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f6f8;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;background:#ffffff;border:1px solid #d8dee6;border-radius:12px;">
          <tr>
            <td style="padding:28px 32px;font-family:Arial,Helvetica,sans-serif;color:#0b1f3a;">
              <img src="{{logoUrl}}" alt="{{companyName}}" width="120" height="40" style="display:block;border:0;max-width:160px;height:auto;">
              <h1 style="margin:16px 0 12px 0;font-size:22px;line-height:1.3;">We received your work</h1>
              <p style="margin:0 0 16px 0;font-size:16px;line-height:1.5;">Hi {{candidateName}}, {{companyName}} has your submission for {{assessmentName}}. Submitted at {{expiresAtFormatted}}. You do not need to do anything else.</p>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td bgcolor="#0b1f3a" style="border-radius:8px;">
                    <a href="{{actionUrl}}" style="display:inline-block;padding:12px 22px;font-family:Arial,Helvetica,sans-serif;font-size:16px;color:#ffffff;text-decoration:none;">View your tasks</a>
                  </td>
                </tr>
              </table>
              <p style="margin:18px 0 0 0;font-size:13px;line-height:1.5;color:#64748b;">{{actionUrl}}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
