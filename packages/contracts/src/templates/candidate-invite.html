<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're invited</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f8;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f6f8;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;background:#ffffff;border:1px solid #d8dee6;border-radius:12px;">
          <tr>
            <td style="padding:28px 32px 8px 32px;font-family:Arial,Helvetica,sans-serif;">
              <img src="{{logoUrl}}" alt="{{companyName}}" width="120" height="40" style="display:block;border:0;outline:none;text-decoration:none;max-width:160px;height:auto;">
              <p style="margin:16px 0 0 0;font-size:13px;color:#64748b;">HelloSmart.ai</p>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 32px 28px 32px;font-family:Arial,Helvetica,sans-serif;color:#0b1f3a;">
              <h1 style="margin:0 0 12px 0;font-size:22px;line-height:1.3;">Hi {{candidateName}},</h1>
              <p style="margin:0 0 16px 0;font-size:16px;line-height:1.5;">{{companyName}} invited you to <strong>{{assessmentName}}</strong>. You have {{durationMinutes}} minutes once you start. This link expires {{expiresAtFormatted}}.</p>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td bgcolor="#ea580c" style="border-radius:8px;">
                    <a href="{{actionUrl}}" style="display:inline-block;padding:12px 22px;font-family:Arial,Helvetica,sans-serif;font-size:16px;color:#ffffff;text-decoration:none;border-radius:8px;">Open your assessment</a>
                  </td>
                </tr>
              </table>
              <p style="margin:18px 0 0 0;font-size:13px;line-height:1.5;color:#64748b;">If the button does not work, copy this link into your browser:<br>{{actionUrl}}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
